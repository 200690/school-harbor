logging:
  level:
    com.hmall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-dynamic-parameter: true
  documents:
    - name: 标题
      locations: classpath:markdown/*
