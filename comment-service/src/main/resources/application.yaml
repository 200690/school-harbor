server:
  port: 8084
spring:
  application:
    name: comment-service
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${harbor.db.host}:3306/${harbor.db.database}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${harbor.db.pw}
  cloud:
    nacos:
      server-addr: 115.190.252.109:8848
  rabbitmq:
    host: 115.190.252.109 # 你的虚拟机IP
    port: 5672 # 端口
    virtual-host: /harbor  # 虚拟主机
    username: harbor # 用户名
    password: harbor # 密
    # 生产者确认配置（可选，确保消息成功投递到交换机）
    publisher-confirm-type: correlated
    # 生产者退回配置（可选，消息无法路由到队列时回调）
    publisher-returns: true
    # 消费者配置（可选，手动确认消息，避免自动确认导致消息丢失）
