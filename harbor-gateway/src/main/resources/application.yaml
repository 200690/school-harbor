server:
  port: 8090
spring:
  application:
    name: harbor-gateway
  profiles:
    active: local
  cloud:
    nacos:
      server-addr: 115.190.252.109:8848
    gateway:
      routes:
        - id: part-time # 路由规则id，自定义，唯一
          uri: lb://part-time # 路由的目标服务，lb代表负载均衡，会从注册中心拉取服务列表
          predicates: # 路由断言，判断当前请求是否符合当前规则，符合则路由到目标服务
            - Path=/api/part-time/** # 这里是以请求路径作为判断规则
          filters:
            # 去掉 /api，保留 /user/**
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: second-hand
          uri: lb://second-hand
          predicates:
            - Path=/api/second-hand/**
          filters:
            # 去掉 /api，保留 /user/**
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: user
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            # 去掉 /api，保留 /user/**
            - RewritePath=/api/(?<segment>.*), /$\{segment}
#        - id: trade
#          uri: lb://trade-service
#          predicates:
#            - Path=/orders/**
        - id: pay
          uri: lb://pay-service
          predicates:
            - Path=/api/pay/**
          filters:
            # 去掉 /api，保留 /user/**
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: comment
          uri: lb://comment-service
          predicates:
            - Path=/api/comment/**
          filters:
            # 去掉 /api，保留 /user/**
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        - id: message
          uri: lb://message-service
          predicates:
            - Path=/api/message/**
          filters:
            # 去掉 /api，保留 /user/**
            - RewritePath=/api/(?<segment>.*), /$\{segment}

