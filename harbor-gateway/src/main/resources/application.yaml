harbor:
  jwt:
    location: classpath:harbor.jks
    alias: harbor
    password: harbor
    tokenTTL: 3000m
  auth:
    excludePaths:
      - /api/part-time/list
      - /api/user/user/login
      - /api/user/user/register
      - /api/second-hand/list
      - /api/index
