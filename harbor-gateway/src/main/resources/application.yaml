server:
  port: 8080
spring:
  application:
    name: harbor-gateway
  profiles:
    active: local

harbor:
  jwt:
    location: classpath:harbor.jks
    alias: harbor
    password: harbor
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi
